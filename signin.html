<html>
<head> 
 <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    
</head>
  <body>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script type="module" >
  // Import the functions you need from the SDKs you need
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-analytics.js";
      import {getAuth, GoogleAuthProvider, signInWithCredential, onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
     // import {getDatabase, set, ref, onValue, child, get } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";
      const firebaseConfig = {
          apiKey: "AIzaSyCoBXilVjbiqy4jaNLoZyLvrwZZYJepock",
          authDomain: "memory-mainafly.firebaseapp.com",
          projectId: "memory-mainafly",
          storageBucket: "memory-mainafly.firebasestorage.app",
          messagingSenderId: "707099086296",
          appId: "1:707099086296:web:eccec04bb938249911f6ad",
          measurementId: "G-JP3GZ9YFBP"
      };
      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      const auth = getAuth(app);
      const provider= new GoogleAuthProvider();
      //const db = getDatabase(app);
      
      async function handleCredentialResponse(response) {
          const idToken = response.credential;
          try {
              const credential = GoogleAuthProvider.credential(idToken);
              const result = await signInWithCredential(auth, credential);
              localStorage.setItem("email", result.user.email);
              window.location.href = "index.html";
              user.innerHTML = `
              Email: ${result.user.email}</br>
              Name: ${result.user.displayName}`;
          } catch (e) {
              error.innerHTML = e.message;
          }
      }
      window.onload = async function () {
       try {
       // let email = localStorage.getItem("email");
        
          let userPromise = new Promise(resolve=> onAuthStateChanged(auth, user=> resolve(user)));
          
       // msg.innerHTML = "Please wait...";
             let user = await userPromise;
    //    msg.innerHTML = "";
        msg.style.display = "none";
              if (user) {//user has signed in
                  localStorage.setItem("email", user.email);
                  window.location.href = "index.html";
              }
              else {
                  google.accounts.id.initialize({
                      client_id: "707099086296-ashsakkk7epp3erru62ske4k7a9oinbs.apps.googleusercontent.com",
                      callback: handleCredentialResponse,
                      redirect_url: "https://memory.mainafly.com/signin.html"
                  });
                  google.accounts.id.renderButton(
                  document.getElementById("buttonDiv"),
                  { theme: "outline", size: "large" }  // customization attributes
                  );
                  google.accounts.id.prompt(); // also display the One Tap dialog
              }
       }    catch(e){
               error.innerHTML = e.message;
              }
      }
    </script>
   <div id="msg">Please wait...</div>
    <div id="buttonDiv"></div>
    <div id="error">
      
    </div>
    <div id="user">
     
    </div>
   <style>
    body, html {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #f0f4f8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 30px 50px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      font-size: 24px;
      font-weight: bold;
      color: #2c3e50;
      text-align: center;
      animation: fadeIn 1s ease-in-out infinite alternate;
    }

    @keyframes fadeIn {
      from { opacity: 0.6; }
      to { opacity: 1; }
    }
    
   </style>
  </body>
</html>
